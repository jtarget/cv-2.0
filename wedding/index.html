<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#f6f5f1" />
		<meta name="description" content="8 and 9 December 2026, Copenhagen. Please reply by 31 October." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://joaomira.com/wedding/" />
		<meta property="og:title" content="Anja & João" />
		<meta property="og:description" content="8 and 9 December 2026, Copenhagen. Please reply by 31 October." />
		<meta property="og:image" content="https://joaomira.com/wedding/img/share.jpg?v=4" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
		<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
			rel="stylesheet"
		/>
		<title>Anja & João</title>
		<style>
			:root {
				--bg: #f6f5f1;
				--surface: #ffffff;
				--sunk: #eeede8;
				--ink: #17171c;
				--ink-2: #4b4b55;
				--muted: #74737c;
				--hair: rgba(23, 23, 28, .08);
				--hair-2: rgba(23, 23, 28, .14);
				--indigo: #3e3cb8;
				--indigo-deep: #2c2a8e;
				--indigo-tint: #efeffa;
				--leaf: #4d6a3c;
				--error: #b0402c;
				--sans: Geist, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
				--mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
				--serif: "Instrument Serif", Georgia, serif;
				--ease: cubic-bezier(.2, .7, .2, 1);
			}
			*, *::before, *::after { box-sizing: border-box; }
			[hidden] { display: none !important; }
			html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; overflow-x: clip; }
			body {
				margin: 0; background: var(--bg); color: var(--ink);
				font: 400 16px/1.55 var(--sans); letter-spacing: -0.005em;
				-webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
				overflow-x: clip;
			}
			a { color: inherit; }
			h1, h2, h3, h4, .intro, .field > .title { text-wrap: balance; }
			p, .check span { text-wrap: pretty; }
			.wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

			/* Language switch */
			.langs {
				position: sticky; top: 0; z-index: 20;
				display: flex; justify-content: flex-end; gap: 20px;
				margin: 0 calc(50% - 50vw); padding: 18px calc(50vw - 50%);
				transition: background .3s, box-shadow .3s;
			}
			.langs.scrolled {
				background: color-mix(in srgb, var(--bg) 82%, transparent); box-shadow: 0 1px 0 var(--hair);
				-webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
			}
			.langs button {
				font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
				background: none; border: 0; padding: 4px 0; color: var(--muted); cursor: pointer;
				transition: color .2s;
			}
			.langs button:hover { color: var(--ink); }
			.langs button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }

			/* Hero */
			header { position: relative; }
			.invite {
				position: relative; display: grid; grid-template-columns: 1fr auto;
				grid-template-rows: auto minmax(48px, 1fr) auto auto auto auto;
				min-height: min(74svh, 680px); padding: 40px 0 72px;
			}
			.invite::before {
				content: ""; position: absolute; z-index: -1; pointer-events: none;
				top: -120px; right: -260px; width: 640px; height: 640px; border-radius: 50%;
				background: radial-gradient(closest-side, rgba(92, 90, 230, .16), rgba(92, 90, 230, .05) 55%, transparent);
			}
			.invite .ornament { display: none; }
			.kicker, .when {
				grid-row: 1; margin: 0;
				font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
			}
			.kicker { grid-column: 1; }
			.when { grid-column: 2; text-align: right; }
			h1 {
				grid-row: 3; grid-column: 1 / -1; margin: 0;
				font: 300 clamp(76px, 15.5vw, 172px)/.86 var(--sans); letter-spacing: -0.06em; color: var(--ink);
			}
			h1 .amp {
				font: italic 400 1.04em/0 var(--serif); letter-spacing: 0; color: var(--indigo);
				margin: 0 -.10em 0 .0525em; /* optical spacing: the J stem sits far right, so it tucks in under the & */
			}
			.intro {
				grid-row: 4; grid-column: 1 / -1; margin: 40px 0 0; max-width: 24ch;
				font: 400 clamp(20px, 2.6vw, 24px)/1.35 var(--sans); letter-spacing: -0.02em; color: var(--ink);
			}
			.reply-by {
				display: inline-flex; align-items: flex-start; gap: 10px;
				font: 500 11px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--indigo);
			}
			.reply-by::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--indigo); }
			.invite .reply-by { grid-row: 5; grid-column: 1 / -1; margin: 22px 0 0; }
			.cta {
				grid-row: 6; grid-column: 1 / -1; justify-self: start;
				display: inline-flex; align-items: center; gap: 10px; margin-top: 32px;
				height: 52px; padding: 0 22px; border-radius: 999px;
				font: 500 15px/1 var(--sans); color: #fff; text-decoration: none; background: var(--indigo);
				box-shadow: 0 1px 0 rgba(255, 255, 255, .15) inset, 0 10px 30px -10px rgba(62, 60, 184, .55);
				transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .2s;
			}
			.cta:hover { transform: translateY(-1px); background: var(--indigo-deep); }

			/* Sections */
			section { counter-increment: section; border-top: 1px solid var(--hair-2); padding: 40px 0 88px; scroll-margin-top: 56px; }
			section > h2 { margin: 0 0 56px; font: 400 clamp(44px, 8vw, 72px)/.95 var(--sans); letter-spacing: -0.045em; }
			section > h2::before {
				content: counter(section, decimal-leading-zero); display: block; margin-bottom: 28px;
				font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--indigo);
			}
			section > h2:has(+ .reply-by.under) { margin-bottom: 20px; }
			section > .reply-by.under { margin: 0 0 56px; }

			/* Programme */
			.day + .day { margin-top: 56px; }
			.day-title {
				display: flex; align-items: center; gap: 16px; margin: 0;
				font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
			}
			.day-title::after { content: ""; flex: 1; height: 1px; background: var(--hair-2); }
			.event { display: grid; grid-template-columns: 132px 1fr; gap: 0 24px; padding: 28px 0; border-bottom: 1px solid var(--hair); }
			.event:last-child { border-bottom: 0; }
			.event .time { font: 500 13px/1.9 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
			.event .time .until { color: var(--muted); }
			.event .time .until::before { content: " → "; }
			.event > div:last-child { display: flex; flex-direction: column; align-items: flex-start; }
			.event h3 { margin: 0; font: 500 22px/1.25 var(--sans); letter-spacing: -0.025em; }
			.event p { margin: 8px 0 0; max-width: 56ch; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
			.event .on-us {
				order: 1; display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
				font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--indigo);
			}
			.event .on-us::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
			.event .maps { order: 2; display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 16px 0 0; }
			.event .map {
				display: inline-flex; align-items: center; gap: 6px; padding-bottom: 2px;
				font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none;
				border-bottom: 1px solid var(--hair-2); transition: border-color .2s, color .2s;
			}
			.event .map::after { content: "↗"; font-size: 12px; color: var(--muted); transition: transform .2s var(--ease), color .2s; }
			.event .map:hover { border-color: var(--indigo); color: var(--indigo); }
			.event .map:hover::after { color: var(--indigo); transform: translate(1px, -1px); }
			.event .tip {
				order: 3; margin-top: 20px; padding: 18px 20px; max-width: 520px;
				background: var(--surface); border: 1px solid var(--hair); border-radius: 18px;
				font-size: 14px; line-height: 1.55; color: var(--ink-2);
			}
			.event .tip .stores { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
			.event .tip .stores a { display: block; line-height: 0; border-radius: 8px; transition: opacity .2s, transform .25s var(--ease); }
			.event .tip .stores a:hover { opacity: .85; transform: translateY(-1px); }
			.event .tip .stores img { display: block; width: auto; height: 40px; }

			/* Form */
			.sheet { position: relative; }
			form { display: grid; gap: 64px; counter-reset: step; }
			.field > .title { counter-increment: step; display: block; margin: 0 0 6px; font: 500 24px/1.2 var(--sans); letter-spacing: -0.025em; }
			.field > .title::before {
				content: counter(step); display: grid; place-items: center; width: 24px; height: 24px; margin-bottom: 16px;
				border: 1px solid rgba(62, 60, 184, .35); border-radius: 50%;
				font: 500 11px/1 var(--mono); color: var(--indigo);
			}
			.hint { margin: 0 0 18px; font-size: 14px; color: var(--muted); }
			.field > .title + input, .field > .title + .chips, .field > .title + .drinks { margin-top: 18px; }
			input[type="text"], textarea {
				width: 100%; font: 400 16px/1.4 var(--sans); color: var(--ink);
				background: var(--surface); border: 1px solid var(--hair-2); border-radius: 16px;
				padding: 17px 18px; outline: none; transition: border-color .2s, box-shadow .2s;
			}
			input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
			input[type="text"]:focus, textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(62, 60, 184, .12); }
			textarea { min-height: 132px; resize: vertical; }

			/* Grouped choice lists */
			.checks, .drinks {
				display: grid; background: var(--surface); border: 1px solid var(--hair); border-radius: 20px; overflow: hidden;
			}
			.check {
				position: relative; display: flex; align-items: center; gap: 16px; cursor: pointer;
				padding: 18px 20px; border-bottom: 1px solid var(--hair); transition: background .2s;
			}
			.check:last-child { border-bottom: 0; }
			.check:hover { background: #fbfbf9; }
			.check:has(input:checked) { background: var(--indigo-tint); }
			.check:has(input:disabled) { opacity: .45; cursor: not-allowed; }
			.check input {
				appearance: none; -webkit-appearance: none; margin: 0; flex: none;
				width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--hair-2); background: var(--surface);
				display: grid; place-items: center; transition: background .2s, border-color .2s;
			}
			.check input[type="radio"] { border-radius: 50%; }
			.check input::after {
				content: ""; width: 10px; height: 6px; margin-top: -3px;
				border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) scale(0); transition: transform .2s var(--ease);
			}
			.check input:checked { background: var(--indigo); border-color: var(--indigo); }
			.check input:checked::after { transform: rotate(-45deg) scale(1); }
			.check input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
			.check strong { display: block; font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
			.check span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
			.check.none strong { font-weight: 400; color: var(--ink-2); }
			.drinks .emoji { font-size: 18px; line-height: 1; margin: 0; }
			.drinks .check { gap: 14px; }

			.boat-only:not([hidden]), .eats:not([hidden]) { animation: rise .5s var(--ease) both; }
			@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

			/* Sandwich picker */
			.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 0 18px; background: var(--sunk); border-radius: 16px; }
			.seg button {
				height: 46px; border: 0; border-radius: 12px; background: none; cursor: pointer;
				font: 500 14px/1 var(--sans); color: var(--ink-2); transition: background .2s, color .2s, box-shadow .2s;
			}
			.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px rgba(0, 0, 0, .04); }
			.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
			.filters button {
				height: 34px; padding: 0 14px; border-radius: 999px; cursor: pointer;
				font: 500 13px/1 var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--hair-2);
				transition: background .2s, color .2s, border-color .2s;
			}
			.filters button:hover { border-color: var(--ink); }
			.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
			.counter { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--indigo); }
			.dots { display: inline-flex; gap: 4px; }
			.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--indigo); transition: background .2s; }
			.dots i.on { background: var(--indigo); }

			.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px 18px; }
			.bundle-grid { grid-template-columns: repeat(2, 1fr); }
			.card { position: relative; display: block; cursor: pointer; text-align: left; }
			.card[hidden] { display: none; }
			.card input { position: absolute; opacity: 0; pointer-events: none; }
			.card img {
				display: block; width: 100%; height: auto; aspect-ratio: 860 / 696; object-fit: cover;
				border-radius: 18px; background: var(--sunk);
				outline: 2px solid transparent; outline-offset: 3px; transition: outline-color .2s, filter .3s;
			}
			.card:hover img { filter: brightness(.97); }
			.card .body { padding: 14px 2px 0; }
			.card h4 { margin: 0 0 4px; font: 500 15px/1.3 var(--sans); letter-spacing: -0.015em; }
			.card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
			.card .veg { display: inline-block; margin-top: 10px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--leaf); }
			.card .tick {
				position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
				display: grid; place-items: center; font: 500 12px/1 var(--mono); color: transparent;
				background: rgba(255, 255, 255, .7); border: 1px solid rgba(255, 255, 255, .9);
				-webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
				box-shadow: 0 2px 8px rgba(0, 0, 0, .08); transition: background .2s, color .2s, transform .25s var(--ease);
			}
			.card:has(input:checked) img { outline-color: var(--indigo); }
			.card:has(input:checked) .tick { background: var(--indigo); border-color: var(--indigo); color: #fff; transform: scale(1.06); }
			.card:has(input:disabled) { opacity: .35; cursor: not-allowed; }
			.card:has(input:focus-visible) img { outline-color: var(--ink); }

			/* Dietary chips */
			.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
			.chip { position: relative; cursor: pointer; }
			.chip input { position: absolute; opacity: 0; pointer-events: none; }
			.chip span {
				display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px;
				font: 500 14px/1 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--hair-2);
				transition: background .2s, color .2s, border-color .2s;
			}
			.chip:hover span { border-color: var(--ink); }
			.chip input:checked + span { background: var(--indigo); border-color: var(--indigo); color: #fff; }
			.chip input:checked + span::before { content: "✓"; font-size: 12px; }
			.chip input:focus-visible + span { outline: 2px solid var(--indigo); outline-offset: 2px; }

			.error { margin: 12px 0 0; font-size: 13px; color: var(--error); }
			.error:empty { display: none; }

			.submit {
				width: 100%; height: 60px; border: 0; border-radius: 18px; cursor: pointer;
				font: 500 16px/1 var(--sans); color: #fff; background: var(--indigo);
				box-shadow: 0 1px 0 rgba(255, 255, 255, .15) inset, 0 14px 34px -14px rgba(62, 60, 184, .6);
				transition: transform .25s var(--ease), background .2s;
			}
			.submit:hover { transform: translateY(-1px); background: var(--indigo-deep); }
			.submit:disabled { opacity: .6; cursor: wait; transform: none; }

			/* Thank you */
			.thanks { padding: 56px 28px; text-align: center; background: var(--surface); border: 1px solid var(--hair); border-radius: 28px; animation: rise .5s var(--ease) both; }
			.thanks .ornament { color: var(--indigo); }
			.thanks h2 { margin: 18px 0 10px; font: 400 44px/1 var(--sans); letter-spacing: -0.04em; }
			.thanks > p { max-width: 36ch; margin: 0 auto 28px; color: var(--ink-2); }
			.summary { list-style: none; display: grid; gap: 12px; max-width: 420px; margin: 0 auto 28px; padding: 20px 22px; text-align: left; background: var(--bg); border-radius: 18px; }
			.summary:empty { display: none; }
			.summary li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; color: var(--ink-2); }
			.summary li b { font-weight: 500; color: var(--ink); }
			.thanks button { height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--hair-2); background: none; cursor: pointer; font: 500 14px/1 var(--sans); color: var(--ink); }
			.thanks button:hover { border-color: var(--ink); }

			footer { display: flex; justify-content: space-between; gap: 16px; padding: 28px 0 56px; border-top: 1px solid var(--hair-2); font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
			footer .ornament { display: none; }

			/* Picks tray */
			.tray {
				position: fixed; left: 50%; bottom: 18px; z-index: 30;
				display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 6px; border-radius: 999px;
				background: rgba(23, 23, 28, .88); color: #fff; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
				box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35);
				font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
				transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
				transition: transform .4s var(--ease), visibility 0s .4s, background .3s;
			}
			.tray.show { transform: translate(-50%, 0); visibility: visible; transition: transform .4s var(--ease), background .3s; }
			.tray.done { background: var(--indigo); }
			.tray .slots { display: flex; }
			.tray .slot { width: 34px; height: 34px; margin-right: -9px; border-radius: 50%; border: 2px solid rgba(23, 23, 28, .9); background: rgba(255, 255, 255, .16) center / cover; }
			.tray.done .slot { border-color: var(--indigo); }
			.tray .slot:last-child { margin-right: 0; }

			/* Add to calendar */
			section > h2:has(+ .add-cal) { margin-bottom: 22px; }
			.add-cal {
				display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 999px;
				font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--indigo); text-decoration: none;
				background: var(--indigo-tint); transition: background .2s, transform .2s var(--ease);
			}
			.add-cal:hover { background: #e4e4f8; }
			section > .add-cal { margin: 0 0 56px; }
			.thanks .add-cal { margin: 0 6px 12px; }

			/* Note for guests who already answered */
			.answered { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--indigo-tint); color: var(--indigo-deep); font-size: 14px; line-height: 1.5; }

			/* Floating answer button while reading the plan */
			.float-cta {
				position: fixed; left: 50%; bottom: 18px; z-index: 25;
				display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 999px;
				font: 500 14px/1 var(--sans); color: #fff; text-decoration: none;
				background: rgba(23, 23, 28, .88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
				box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35);
				transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
				transition: transform .45s var(--ease), visibility 0s .45s, background .2s;
			}

			const LANGS = Object.keys(T);
			const $ = (s) => document.querySelector(s);
			const $$ = (s) => [...document.querySelectorAll(s)];

			let lang = pickLang();
			let mode = "singles";
			let filter = "all";
			const FISH = new Set(["rejer-surdej", "sild", "aeg-rejer", "laksetatar", "laks", "roedspaette", "roedspaette-rejesalat"]);
			const kind = (item) => (item.veg ? "veg" : FISH.has(item.id) ? "fish" : "meat");
			const picks = []; // single sandwich ids, in the order they were chosen

			function pickLang() {
				try {
					const saved = localStorage.getItem("wedding-lang");
					if (LANGS.includes(saved)) return saved;
				} catch (e) {}
				for (const l of navigator.languages || [navigator.language || ""]) {
					const code = l.toLowerCase().slice(0, 2);
					if (LANGS.includes(code)) return code;
				}
				return "en";
			}

			function card(item, type) {
				const [title, desc] = item[lang];
				return `<label class="card" data-kind="${kind(item)}">
					<input type="${type}" name="${type === "radio" ? "bundle" : "single"}" value="${item.id}" />
					<img src="img/${item.id}.jpg" alt="" loading="lazy" decoding="async" width="860" height="696" />
					<span class="tick" aria-hidden="true">✓</span>
					<div class="body">
						<h4>${title}</h4>
						<p>${desc}</p>
						${item.veg ? `<span class="veg">🌱 ${T[lang].veg}</span>` : ""}
					</div>
				</label>`;
			}

			function renderMenu() {
				const bundle = $('input[name="bundle"]:checked')?.value;
				$("#singles-grid").innerHTML = MENU.singles.map((i) => card(i, "checkbox")).join("");
				$("#bundles-grid").innerHTML = MENU.bundles.map((i) => card(i, "radio")).join("");
				$$('input[name="single"]').forEach((i) => (i.checked = picks.includes(i.value)));
				$$('input[name="bundle"]').forEach((i) => (i.checked = i.value === bundle));
				applyFilter();
				updateSingles();
			}

			function applyFilter() {
				$$(".filters button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.filter === filter));
				// Chosen sandwiches stay visible so a pick never disappears from view.
				$$("#singles-grid .card").forEach((c) => {
					c.hidden = filter !== "all" && c.dataset.kind !== filter && !c.querySelector("input").checked;
				});
			}

			function applyLang() {
				const t = T[lang];
				document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
				$$("[data-t]").forEach((el) => {
					const v = t[el.dataset.t];
					if (typeof v === "string") el.textContent = v;
				});
				$$("[data-ph]").forEach((el) => (el.placeholder = t[el.dataset.ph]));
				// Countdown to the reply deadline, the end of 31 October in Copenhagen.
				const left = Math.ceil((new Date("2026-10-31T23:59:59+01:00") - Date.now()) / 864e5);
				$$('[data-t="replyBy"]').forEach((el) => (el.textContent = left > 0 ? `${t.replyBy} · ${t.daysLeft(left)}` : t.replyBy));
				$$("[data-cal]").forEach((a) => (a.href = `cal/anja-joao-${lang}.ics`));
				showAnswered();
				// Official store badges, in the page language.
				$$("[data-badge]").forEach((img) => {
					img.src = `img/badges/${img.dataset.badge}-${lang}.${img.dataset.badge === "apple" ? "svg" : "png"}`;
				});
				$$(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
				renderMenu();
				clearErrors();
			}

			// A returning guest sees that they already answered, so answers aren't sent twice by accident.
			function showAnswered() {
				let prev = null;
				try { prev = JSON.parse(localStorage.getItem("wedding-answered")); } catch (e) {}
				const note = $("#answered");
				note.hidden = !prev?.name;
				if (prev?.name) note.textContent = T[lang].answered(prev.name);
			}

			function updateSingles() {
				const n = picks.length;
				const dots = [0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
				$("#counter").innerHTML = `<span class="dots">${dots}</span>${T[lang].counter(n)}`;
				$$('input[name="single"]').forEach((i) => {
					i.disabled = !i.checked && n >= 3;
					const order = picks.indexOf(i.value);
					i.closest(".card").querySelector(".tick").textContent = order >= 0 ? order + 1 : "";
				});
				updateTray();
			}

			// The tray shows while the sandwich list is on screen and singles are being chosen.
			let menuInView = false;
			function updateTray() {
				const tray = $("#tray");
				const n = picks.length;
				const boat = $('input[name="events"][value="boat"]')?.checked;
				$$("#tray .slot").forEach((el, i) => {
					el.style.backgroundImage = picks[i] ? `url(img/${picks[i]}.jpg)` : "";
				});
				$("#tray-text").textContent = T[lang].counter(n);
				tray.classList.toggle("done", n >= 2);
				tray.classList.toggle("show", Boolean(boat && mode === "singles" && menuInView && !$("#form").hidden));
			}
			new IntersectionObserver(([e]) => {
				menuInView = e.isIntersecting;
				updateTray();
			}, { rootMargin: "-30% 0px -10% 0px" }).observe($("#singles-grid"));

			function setMode(m) {
				mode = m;
				$$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
				$("#singles").hidden = m !== "singles";
				$("#bundles").hidden = m !== "bundle";
				$("#err-sandwich").textContent = "";
				updateTray();
			}

			function updateEvents() {
				const none = $("#none").checked;
				$$('input[name="events"]').forEach((i) => {
					if (none) i.checked = false;
					i.disabled = none;
				});
				const boat = $('input[name="events"][value="boat"]').checked;
				$$(".boat-only").forEach((el) => (el.hidden = !boat));
				$(".eats").hidden = !$$('input[name="events"]:checked').some((i) => i.value !== "ceremony");
				updateTray();
			}

			function clearErrors() {
				$$(".error").forEach((e) => (e.textContent = ""));
			}

			function validate() {
				const t = T[lang];
				clearErrors();
				let first = null;
				const fail = (id, msg, el) => {
					$(id).textContent = msg;
					first ||= el;
				};
				if (!$("#name").value.trim()) fail("#err-name", t.errName, $("#name"));
				const events = $$('input[name="events"]:checked').map((i) => i.value);
				if (!events.length && !$("#none").checked) fail("#err-events", t.errEvents, $(".checks"));
				if (events.includes("boat")) {
					if (mode === "singles" && picks.length < 2)
						fail("#err-sandwich", t.errSingles, $(".seg"));
					if (mode === "bundle" && !$('input[name="bundle"]:checked'))
						fail("#err-sandwich", t.errBundle, $(".seg"));
					if (!$('input[name="drink"]:checked')) fail("#err-drink", t.errDrink, $(".drinks"));
				}
				if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
				return !first;
			}

			function payload() {
				const events = $$('input[name="events"]:checked').map((i) => i.value);
				const boat = events.includes("boat");
				const daName = (list, id) => list.find((i) => i.id === id).da;
				let sandwiches = "";
				if (boat && mode === "singles")
					sandwiches = picks.map((id) => daName(MENU.singles, id)).join(", ");
				if (boat && mode === "bundle")
					sandwiches = daName(MENU.bundles, $('input[name="bundle"]:checked').value) + " (set)";
				const yes = (e) => (events.includes(e) ? "yes" : "no");
				return {
					name: $("#name").value.trim(),
					coming: events.length ? "yes" : "no",
					boat: yes("boat"),
					ceremony: yes("ceremony"),
					louisiana: yes("louisiana"),
					dinner: yes("dinner"),
					sandwiches,
					drink: boat ? $('input[name="drink"]:checked').value : "",
					dietary: $(".eats").hidden
						? ""
						: [...$$('input[name="diet"]:checked').map((i) => i.value), $("#diet-other").value.trim()].filter(Boolean).join(", "),
					message: $("#message").value.trim(),
					language: lang,
				};
			}

			async function submit(e) {
				e.preventDefault();
				if (!validate()) return;
				const data = payload();
				const btn = $(".submit");
				btn.disabled = true;
				btn.classList.add("is-sending");
				btn.textContent = T[lang].sending;
				try {
					if (SHEET_URL) {
						// Apps Script doesn't send CORS headers, so the response can't be read.
						await fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(data) });
					} else {
						console.warn("SHEET_URL is not set, answer not saved:", data);
					}
					$("#form").hidden = true;
					$("#thanks").hidden = false;
					$("#thanks > p").textContent = data.coming === "yes" ? T[lang].thanksText : T[lang].thanksTextNo;
					$("#summary").innerHTML = summary(data);
					try { localStorage.setItem("wedding-answered", JSON.stringify({ name: data.name })); } catch (e) {}
					showAnswered();
					updateTray();
					$("#rsvp-section").scrollIntoView({ behavior: "smooth" });
				} catch (err) {
					$("#err-send").textContent = T[lang].errSend;
				} finally {
					btn.disabled = false;
					btn.classList.remove("is-sending");
					btn.textContent = T[lang].send;
				}
			}

			function summary(data) {
				const t = T[lang];
				const title = (list, id) => list.find((i) => i.id === id)[lang][0];
				const events = { boat: t.evBoat, ceremony: t.evCeremony, louisiana: t.evLouisiana, dinner: t.evDinner };
				const joined = Object.keys(events).filter((k) => data[k] === "yes").map((k) => events[k]);
				if (!joined.length) return "";
				const rows = [["🗓", t.sumEvents, joined.join(", ")]];
				if (data.boat === "yes") {
					const food = mode === "singles"
						? picks.map((id) => title(MENU.singles, id)).join(", ")
						: title(MENU.bundles, $('input[name="bundle"]:checked').value);
					const box = $(`input[name="drink"][value="${data.drink}"]`).closest(".check");
					const drink = box.querySelector("strong").textContent;
					rows.push(["🥪", t.sumFood, food], [box.querySelector(".emoji").textContent, t.sumDrink, drink]);
				}
				if (data.dietary) {
					const label = (v) => {
						const box = $(`input[name="diet"][value="${v}"]`);
						return box ? box.nextElementSibling.textContent : v;
					};
					rows.push(["🍽", t.dietLabel, data.dietary.split(", ").map(label).join(", ")]);
				}
				const esc = (v) => v.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
				return rows.map(([icon, label, value]) => `<li><span>${icon}</span><span><b>${label}:</b> ${esc(value)}</span></li>`).join("");
			}

			function reset() {
				$("#form").reset();
				picks.length = 0;
				filter = "all";
				applyFilter();
				setMode("singles");
				updateEvents();
				updateSingles();
				$("#thanks").hidden = true;
				$("#form").hidden = false;
				$("#name").focus();
			}

			$$(".langs button").forEach((b) =>
				b.addEventListener("click", () => {
					lang = b.dataset.lang;
					try { localStorage.setItem("wedding-lang", lang); } catch (e) {}
					applyLang();
				})
			);
			$$(".seg button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
			$$(".filters button").forEach((b) =>
				b.addEventListener("click", () => {
					filter = b.dataset.filter;
					applyFilter();
				})
			);
			$("#singles-grid").addEventListener("change", (e) => {
				const id = e.target.value;
				if (e.target.checked) picks.push(id);
				else picks.splice(picks.indexOf(id), 1);
				applyFilter();
				updateSingles();
				$("#err-sandwich").textContent = "";
			});
			$("#bundles-grid").addEventListener("change", () => ($("#err-sandwich").textContent = ""));
			$(".checks").addEventListener("change", () => {
				updateEvents();
				$("#err-events").textContent = "";
			});
			$(".drinks").addEventListener("change", () => ($("#err-drink").textContent = ""));
			$("#name").addEventListener("input", () => ($("#err-name").textContent = ""));
			$("#form").addEventListener("submit", submit);
			$("#again").addEventListener("click", reset);

			applyLang();
			updateEvents();

			const reveal = new IntersectionObserver((entries) => {
				entries.forEach((e) => {
					if (e.isIntersecting) {
						e.target.classList.add("in");
						reveal.unobserve(e.target);
					}
				});
			}, { threshold: 0.08 });
			$$(".reveal").forEach((el) => reveal.observe(el));

			// The language bar only gets its frosted background once the page scrolls.
			const langs = $(".langs");
			const onScroll = () => langs.classList.toggle("scrolled", scrollY > 8);

			// Floating answer button: shown once the hero button is out of view, until the form is reached.
			const floatCta = $(".float-cta");
			let heroOut = false, formIn = false;
			const syncFloat = () => floatCta.classList.toggle("show", heroOut && !formIn);
			new IntersectionObserver(([e]) => { heroOut = !e.isIntersecting; syncFloat(); }).observe($(".invite .cta"));
			new IntersectionObserver(([e]) => { formIn = e.isIntersecting; syncFloat(); }, { rootMargin: "0px 0px -35% 0px" }).observe($("#rsvp-section"));
			addEventListener("scroll", onScroll, { passive: true });
			onScroll();
		</script>
	</body>
</html>
