<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light" />
		<link rel="icon" href="../images/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<title>João & Anja</title>
		<style>
			:root {
				--paper: #f7f1e6;
				--card: #fffbf4;
				--ink: #2b2620;
				--muted: #7a6f62;
				--line: #e4d9c6;
				--accent: #23404a;
				--accent-soft: #e3ebec;
				--gold: #a8843f;
				--error: #a3402e;
				--serif: "Cormorant Garamond", "Songti SC", "Noto Serif SC", Georgia, serif;
				--sans: Inter, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
			}
			* { box-sizing: border-box; }
			html { -webkit-text-size-adjust: 100%; }
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font-family: var(--sans);
				font-size: 16px;
				line-height: 1.55;
			}
			.wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

			/* Language switch */
			.langs {
				display: flex; justify-content: center; gap: 4px;
				padding: 18px 0 0;
			}
			.langs button {
				font: 500 13px/1 var(--sans); letter-spacing: 0.06em;
				background: none; border: 1px solid transparent; color: var(--muted);
				padding: 8px 12px; border-radius: 999px; cursor: pointer;
			}
			.langs button[aria-pressed="true"] { border-color: var(--line); color: var(--ink); background: var(--card); }

			/* Hero */
			header { text-align: center; padding: 56px 0 40px; }
			.flake { color: var(--gold); font-size: 20px; letter-spacing: 0.6em; }
			.kicker { font: 500 12px/1 var(--sans); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 20px 0 14px; }
			h1 { font: 500 clamp(52px, 13vw, 88px)/1 var(--serif); margin: 0; letter-spacing: -0.01em; }
			h1 .amp { font-style: italic; color: var(--gold); font-weight: 400; }
			.when { font: italic 400 22px/1.3 var(--serif); color: var(--muted); margin: 18px 0 0; }
			.intro { max-width: 520px; margin: 28px auto 0; color: var(--ink); }

			hr.rule { border: 0; height: 1px; background: var(--line); margin: 0; }
			h2 { font: 500 34px/1.1 var(--serif); text-align: center; margin: 0 0 28px; }
			section { padding: 48px 0; }

			/* Programme */
			.day { margin-bottom: 36px; }
			.day:last-child { margin-bottom: 0; }
			.day-title { font: 600 12px/1 var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 16px; }
			.event { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); }
			.event .time { font: 500 22px/1.1 var(--serif); color: var(--gold); }
			.event h3 { font: 500 22px/1.2 var(--serif); margin: 0 0 4px; }
			.event p { margin: 0; color: var(--muted); font-size: 15px; }
			.event .maps { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
			.event .map { font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
			.event .map::before { content: "📍 "; }
			.event .map:hover { border-color: var(--accent); }
			.event .on-us { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; }

			/* Form */
			form { display: grid; gap: 36px; }
			.field label.title, .field .title { display: block; font: 500 24px/1.2 var(--serif); margin-bottom: 6px; }
			.hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
			input[type="text"], textarea {
				width: 100%; font: 400 16px/1.4 var(--sans); color: var(--ink);
				background: var(--card); border: 1px solid var(--line); border-radius: 12px;
				padding: 14px 16px; outline: none;
			}
			input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
			textarea { min-height: 120px; resize: vertical; }

			.checks { display: grid; gap: 10px; }
			.check {
				display: flex; gap: 14px; align-items: flex-start; cursor: pointer;
				background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
			}
			.check input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
			.check:has(input:checked) { border-color: var(--accent); }
			.check strong { display: block; font-weight: 500; }
			.check span { color: var(--muted); font-size: 14px; }

			.boat-only[hidden] { display: none; }

			/* Segmented choice */
			.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 18px; }
			.seg button { font: 500 15px/1.2 var(--sans); padding: 12px 10px; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; }
			.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

			.counter { font-size: 14px; color: var(--accent); font-weight: 500; margin: 0 0 14px; }
			.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
			.card {
				position: relative; display: block; cursor: pointer; text-align: left;
				background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
				transition: border-color .15s, box-shadow .15s, opacity .15s;
			}
			.card input { position: absolute; opacity: 0; pointer-events: none; }
			.card img { display: block; width: 100%; height: auto; aspect-ratio: 860 / 696; object-fit: cover; background: var(--line); }
			.card .body { padding: 12px 14px 14px; }
			.card h4 { font: 500 20px/1.15 var(--serif); margin: 0 0 4px; }
			.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
			.card .veg { display: inline-block; font-size: 11px; font-weight: 500; color: #4d6b3a; margin-top: 8px; }
			.card .tick {
				position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
				background: rgba(255,251,244,.92); border: 1px solid var(--line);
				display: grid; place-items: center; font-size: 16px; color: transparent;
			}
			.card:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
			.card:has(input:checked) .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
			.card:has(input:disabled) { opacity: .45; cursor: not-allowed; }
			.card:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }

			.drinks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

			.error { color: var(--error); font-size: 14px; margin: 10px 0 0; }
			.error:empty { display: none; }

			.submit {
				font: 500 17px/1 var(--sans); color: #fff; background: var(--accent);
				border: 0; border-radius: 999px; padding: 18px 28px; width: 100%; cursor: pointer;
			}
			.submit:disabled { opacity: .6; cursor: wait; }

			.thanks { text-align: center; padding: 72px 0; }
			.thanks h2 { margin-bottom: 12px; }
			.thanks p { color: var(--muted); max-width: 460px; margin: 0 auto 24px; }
			.thanks button { font: 500 15px/1 var(--sans); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 12px 20px; cursor: pointer; color: var(--ink); }

			footer { text-align: center; color: var(--muted); padding: 40px 0 56px; font: italic 18px/1.4 var(--serif); }

			@media (max-width: 480px) {
				.grid { grid-template-columns: 1fr 1fr; gap: 10px; }
				.card h4 { font-size: 17px; }
				.card p { font-size: 12px; }
				.card .body { padding: 10px 11px 12px; }
				.event { grid-template-columns: 54px 1fr; gap: 12px; }
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<nav class="langs" aria-label="Language">
				<button type="button" data-lang="en">EN</button>
				<button type="button" data-lang="pt">PT</button>
				<button type="button" data-lang="de">DE</button>
				<button type="button" data-lang="zh">中文</button>
			</nav>

			<header>
				<div class="flake" aria-hidden="true">✻ ✻ ✻</div>
				<p class="kicker" data-t="kicker"></p>
				<h1>João <span class="amp">&amp;</span> Anja</h1>
				<p class="when" data-t="when"></p>
				<p class="intro" data-t="intro"></p>
			</header>

			<hr class="rule" />

			<section aria-labelledby="programme">
				<h2 id="programme" data-t="programme"></h2>

				<div class="day">
					<p class="day-title" data-t="day1"></p>
					<div class="event">
						<div class="time">11:30</div>
						<div>
							<h3 data-t="boatTitle"></h3>
							<p data-t="boatText"></p>
							<p class="maps"><a class="map" href="https://www.google.com/maps/search/?api=1&query=Gammel%20Strand%2C%201202%20K%C3%B8benhavn" target="_blank" rel="noopener">Gammel Strand</a></p>
							<span class="on-us" data-t="boatOnUs"></span>
						</div>
					</div>
					<div class="event">
						<div class="time">13:00</div>
						<div>
							<h3 data-t="tivoliTitle"></h3>
							<p data-t="tivoliText"></p>
							<p class="maps"><a class="map" href="https://www.google.com/maps/search/?api=1&query=Tivoli%20Gardens%2C%20Vesterbrogade%203%2C%201630%20K%C3%B8benhavn" target="_blank" rel="noopener">Tivoli</a></p>
						</div>
					</div>
				</div>

				<div class="day">
					<p class="day-title" data-t="day2"></p>
					<div class="event">
						<div class="time">09:50</div>
						<div>
							<h3 data-t="ceremonyTitle"></h3>
							<p data-t="ceremonyText"></p>
							<p class="maps"><a class="map" href="https://www.google.com/maps/search/?api=1&query=K%C3%B8benhavns%20R%C3%A5dhus%2C%20R%C3%A5dhuspladsen%201%2C%201550%20K%C3%B8benhavn" target="_blank" rel="noopener">Københavns Rådhus</a></p>
						</div>
					</div>
					<div class="event">
						<div class="time">11:00</div>
						<div>
							<h3 data-t="louisianaTitle"></h3>
							<p data-t="louisianaText"></p>
							<p class="maps"><a class="map" href="https://www.google.com/maps/search/?api=1&query=R%C3%A5dhuspladsen%20Station%2C%20K%C3%B8benhavn" target="_blank" rel="noopener">Rådhuspladsen station</a><a class="map" href="https://www.google.com/maps/search/?api=1&query=Louisiana%20Museum%20of%20Modern%20Art%2C%20Gammel%20Strandvej%2013%2C%203050%20Humleb%C3%A6k" target="_blank" rel="noopener">Louisiana</a></p>
							<span class="on-us" data-t="lunchOnUs"></span>
						</div>
					</div>
					<div class="event">
						<div class="time">20:45</div>
						<div>
							<h3 data-t="dinnerTitle"></h3>
							<p data-t="dinnerText"></p>
							<p class="maps"><a class="map" href="https://www.google.com/maps/search/?api=1&query=V%C3%A6kst%2C%20Sankt%20Peders%20Str%C3%A6de%2034%2C%201453%20K%C3%B8benhavn" target="_blank" rel="noopener">Vækst</a></p>
							<span class="on-us" data-t="dinnerOnUs"></span>
						</div>
					</div>
				</div>
			</section>

			<hr class="rule" />

			<section aria-labelledby="rsvp" id="rsvp-section">
				<h2 id="rsvp" data-t="rsvp"></h2>

				<form id="form" novalidate>
					<div class="field">
						<label class="title" for="name" data-t="nameLabel"></label>
						<input type="text" id="name" name="name" autocomplete="name" />
						<p class="error" id="err-name"></p>
					</div>

					<div class="field">
						<span class="title" data-t="joinLabel"></span>
						<p class="hint" data-t="joinHint"></p>
						<div class="checks">
							<label class="check"><input type="checkbox" name="events" value="boat" /><div><strong data-t="evBoat"></strong><span data-t="evBoatWhen"></span></div></label>
							<label class="check"><input type="checkbox" name="events" value="ceremony" /><div><strong data-t="evCeremony"></strong><span data-t="evCeremonyWhen"></span></div></label>
							<label class="check"><input type="checkbox" name="events" value="louisiana" /><div><strong data-t="evLouisiana"></strong><span data-t="evLouisianaWhen"></span></div></label>
							<label class="check"><input type="checkbox" name="events" value="dinner" /><div><strong data-t="evDinner"></strong><span data-t="evDinnerWhen"></span></div></label>
							<label class="check"><input type="checkbox" name="none" id="none" /><div><strong data-t="evNone"></strong></div></label>
						</div>
						<p class="error" id="err-events"></p>
					</div>

					<div class="field boat-only" hidden>
						<span class="title" data-t="sandwichLabel"></span>
						<p class="hint" data-t="sandwichHint"></p>
						<div class="seg" role="group">
							<button type="button" data-mode="singles" aria-pressed="true" data-t="modeSingles"></button>
							<button type="button" data-mode="bundle" aria-pressed="false" data-t="modeBundle"></button>
						</div>
						<div id="singles">
							<p class="counter" id="counter"></p>
							<div class="grid" id="singles-grid"></div>
						</div>
						<div id="bundles" hidden>
							<div class="grid" id="bundles-grid"></div>
						</div>
						<p class="error" id="err-sandwich"></p>
					</div>

					<div class="field boat-only" hidden>
						<span class="title" data-t="drinkLabel"></span>
						<div class="drinks">
							<label class="check"><input type="radio" name="drink" value="Hot chocolate" /><div><strong data-t="drinkChoc"></strong></div></label>
							<label class="check"><input type="radio" name="drink" value="Mulled wine" /><div><strong data-t="drinkWine"></strong></div></label>
						</div>
						<p class="error" id="err-drink"></p>
					</div>

					<div class="field">
						<label class="title" for="message" data-t="messageLabel"></label>
						<p class="hint" data-t="messageHint"></p>
						<textarea id="message" name="message"></textarea>
					</div>

					<div>
						<button class="submit" type="submit" data-t="send"></button>
						<p class="error" id="err-send"></p>
					</div>
				</form>

				<div class="thanks" id="thanks" hidden>
					<div class="flake" aria-hidden="true">✻</div>
					<h2 data-t="thanksTitle"></h2>
					<p data-t="thanksText"></p>
					<button type="button" id="again" data-t="again"></button>
				</div>
			</section>

			<footer>João &amp; Anja · København 2026</footer>
		</div>

		<script src="menu.js"></script>

			const LANGS = Object.keys(T);
			const $ = (s) => document.querySelector(s);
			const $$ = (s) => [...document.querySelectorAll(s)];

			let lang = pickLang();
			let mode = "singles";

			function pickLang() {
				try {
					const saved = localStorage.getItem("wedding-lang");
					if (LANGS.includes(saved)) return saved;
				} catch (e) {}
				for (const l of navigator.languages || [navigator.language || ""]) {
					const code = l.toLowerCase().slice(0, 2);
					if (LANGS.includes(code)) return code;
				}
				return "en";
			}

			function card(item, type) {
				const [title, desc] = item[lang];
				return `<label class="card">
					<input type="${type}" name="${type === "radio" ? "bundle" : "single"}" value="${item.id}" />
					<img src="img/${item.id}.jpg" alt="" loading="lazy" width="860" height="696" />
					<span class="tick" aria-hidden="true">✓</span>
					<div class="body">
						<h4>${title}</h4>
						<p>${desc}</p>
						${item.veg ? `<span class="veg">✿ ${T[lang].veg}</span>` : ""}
					</div>
				</label>`;
			}

			function renderMenu() {
				const picked = new Set($$('input[name="single"]:checked').map((i) => i.value));
				const bundle = $('input[name="bundle"]:checked')?.value;
				$("#singles-grid").innerHTML = MENU.singles.map((i) => card(i, "checkbox")).join("");
				$("#bundles-grid").innerHTML = MENU.bundles.map((i) => card(i, "radio")).join("");
				$$('input[name="single"]').forEach((i) => (i.checked = picked.has(i.value)));
				$$('input[name="bundle"]').forEach((i) => (i.checked = i.value === bundle));
				updateSingles();
			}

			function applyLang() {
				const t = T[lang];
				document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
				$$("[data-t]").forEach((el) => {
					const v = t[el.dataset.t];
					if (typeof v === "string") el.textContent = v;
				});
				$$(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
				renderMenu();
				clearErrors();
			}

			function updateSingles() {
				const checked = $$('input[name="single"]:checked').length;
				$("#counter").textContent = T[lang].counter(checked);
				$$('input[name="single"]').forEach((i) => (i.disabled = !i.checked && checked >= 3));
			}

			function setMode(m) {
				mode = m;
				$$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
				$("#singles").hidden = m !== "singles";
				$("#bundles").hidden = m !== "bundle";
				$("#err-sandwich").textContent = "";
			}

			function updateEvents() {
				const none = $("#none").checked;
				$$('input[name="events"]').forEach((i) => {
					if (none) i.checked = false;
					i.disabled = none;
				});
				const boat = $('input[name="events"][value="boat"]').checked;
				$$(".boat-only").forEach((el) => (el.hidden = !boat));
			}

			function clearErrors() {
				$$(".error").forEach((e) => (e.textContent = ""));
			}

			function validate() {
				const t = T[lang];
				clearErrors();
				let first = null;
				const fail = (id, msg, el) => {
					$(id).textContent = msg;
					first ||= el;
				};
				if (!$("#name").value.trim()) fail("#err-name", t.errName, $("#name"));
				const events = $$('input[name="events"]:checked').map((i) => i.value);
				if (!events.length && !$("#none").checked) fail("#err-events", t.errEvents, $(".checks"));
				if (events.includes("boat")) {
					if (mode === "singles" && $$('input[name="single"]:checked').length !== 3)
						fail("#err-sandwich", t.errSingles, $(".seg"));
					if (mode === "bundle" && !$('input[name="bundle"]:checked'))
						fail("#err-sandwich", t.errBundle, $(".seg"));
					if (!$('input[name="drink"]:checked')) fail("#err-drink", t.errDrink, $(".drinks"));
				}
				if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
				return !first;
			}

			function payload() {
				const events = $$('input[name="events"]:checked').map((i) => i.value);
				const boat = events.includes("boat");
				const daName = (list, id) => list.find((i) => i.id === id).da;
				let sandwiches = "";
				if (boat && mode === "singles")
					sandwiches = $$('input[name="single"]:checked').map((i) => daName(MENU.singles, i.value)).join(", ");
				if (boat && mode === "bundle")
					sandwiches = daName(MENU.bundles, $('input[name="bundle"]:checked').value) + " (set)";
				const yes = (e) => (events.includes(e) ? "yes" : "no");
				return {
					name: $("#name").value.trim(),
					coming: events.length ? "yes" : "no",
					boat: yes("boat"),
					ceremony: yes("ceremony"),
					louisiana: yes("louisiana"),
					dinner: yes("dinner"),
					sandwiches,
					drink: boat ? $('input[name="drink"]:checked').value : "",
					message: $("#message").value.trim(),
					language: lang,
				};
			}

			async function submit(e) {
				e.preventDefault();
				if (!validate()) return;
				const data = payload();
				const btn = $(".submit");
				btn.disabled = true;
				btn.textContent = T[lang].sending;
				try {
					if (SHEET_URL) {
						// Apps Script doesn't send CORS headers, so the response can't be read.
						await fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(data) });
					} else {
						console.warn("SHEET_URL is not set, answer not saved:", data);
					}
					$("#form").hidden = true;
					$("#thanks").hidden = false;
					$("#thanks p").textContent = data.coming === "yes" ? T[lang].thanksText : T[lang].thanksTextNo;
					$("#rsvp-section").scrollIntoView({ behavior: "smooth" });
				} catch (err) {
					$("#err-send").textContent = T[lang].errSend;
				} finally {
					btn.disabled = false;
					btn.textContent = T[lang].send;
				}
			}

			function reset() {
				$("#form").reset();
				setMode("singles");
				updateEvents();
				updateSingles();
				$("#thanks").hidden = true;
				$("#form").hidden = false;
				$("#name").focus();
			}

			$$(".langs button").forEach((b) =>
				b.addEventListener("click", () => {
					lang = b.dataset.lang;
					try { localStorage.setItem("wedding-lang", lang); } catch (e) {}
					applyLang();
				})
			);
			$$(".seg button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
			$("#singles-grid").addEventListener("change", () => {
				updateSingles();
				$("#err-sandwich").textContent = "";
			});
			$("#bundles-grid").addEventListener("change", () => ($("#err-sandwich").textContent = ""));
			$(".checks").addEventListener("change", () => {
				updateEvents();
				$("#err-events").textContent = "";
			});
			$(".drinks").addEventListener("change", () => ($("#err-drink").textContent = ""));
			$("#name").addEventListener("input", () => ($("#err-name").textContent = ""));
			$("#form").addEventListener("submit", submit);
			$("#again").addEventListener("click", reset);

			applyLang();
			updateEvents();
		</script>
	</body>
