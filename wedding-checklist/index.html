<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#f6f5f1" />
		<link rel="icon" type="image/png" sizes="32x32" href="../wedding/img/icon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="../wedding/img/icon-192.png" />
		<link rel="apple-touch-icon" href="../wedding/img/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
			rel="stylesheet"
		/>
		<title>Anja & João · Checklist</title>
		<style>
			:root {
				--bg: #f6f5f1;
				--surface: #ffffff;
				--sunk: #eeede8;
				--ink: #17171c;
				--ink-2: #4b4b55;
				--muted: #74737c;
				--hair: rgba(23, 23, 28, .08);
				--hair-2: rgba(23, 23, 28, .14);
				--indigo: #3e3cb8;
				--indigo-deep: #2c2a8e;
				--indigo-tint: #efeffa;
				--sans: Geist, system-ui, sans-serif;
				--mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
				--serif: "Instrument Serif", Georgia, serif;
				--ease: cubic-bezier(.2, .7, .2, 1);
			}
			*, *::before, *::after { box-sizing: border-box; }
			[hidden] { display: none !important; }
			html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
			body {
				margin: 0; background: var(--bg); color: var(--ink);
				font: 400 16px/1.55 var(--sans); letter-spacing: -0.005em;
				-webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
				overflow-x: clip;
			}
			a { color: inherit; }
			h1, h2 { text-wrap: balance; }
			p, .check span { text-wrap: pretty; }
			.wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

			/* Hero */
			.invite {
				position: relative; display: grid; grid-template-columns: 1fr auto;
				padding: 56px 0 72px; gap: 0;
			}
			.invite::before {
				content: ""; position: absolute; z-index: -1; pointer-events: none;
				top: -120px; right: -260px; width: 640px; height: 640px; border-radius: 50%;
				background: radial-gradient(closest-side, rgba(92, 90, 230, .16), rgba(92, 90, 230, .05) 55%, transparent);
			}
			.kicker, .when {
				margin: 0; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
			}
			.when { text-align: right; }
			h1 {
				grid-column: 1 / -1; margin: 64px 0 0;
				font: 300 clamp(56px, 11vw, 120px)/.9 var(--sans); letter-spacing: -0.06em; color: var(--ink);
			}
			h1 .amp { font: italic 400 1.04em/0 var(--serif); letter-spacing: 0; color: var(--indigo); margin: 0 -.10em 0 .0525em; }
			.intro {
				grid-column: 1 / -1; margin: 32px 0 0; max-width: 32ch;
				font: 400 clamp(20px, 2.6vw, 24px)/1.35 var(--sans); letter-spacing: -0.02em;
			}
			.progress {
				grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 32px; max-width: 420px;
				font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--indigo);
				font-variant-numeric: tabular-nums;
			}
			.bar { flex: 1; height: 4px; border-radius: 2px; background: var(--hair-2); overflow: hidden; }
			.bar span { display: block; height: 100%; width: 0; background: var(--indigo); transition: width .4s var(--ease); }

			/* Sections */
			section { counter-increment: section; border-top: 1px solid var(--hair-2); padding: 40px 0 72px; }
			section > h2 { margin: 0 0 40px; font: 400 clamp(36px, 6vw, 56px)/.95 var(--sans); letter-spacing: -0.045em; }
			section > h2::before {
				content: counter(section, decimal-leading-zero); display: block; margin-bottom: 24px;
				font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--indigo);
			}

			/* Checklist */
			.checks { display: grid; background: var(--surface); border: 1px solid var(--hair); border-radius: 20px; overflow: hidden; }
			.check {
				display: grid; grid-template-columns: auto 64px 1fr; align-items: start; gap: 16px; cursor: pointer;
				padding: 18px 20px; border-bottom: 1px solid var(--hair); transition: background .2s;
			}
			.check:last-child { border-bottom: 0; }
			.check:hover { background: #fbfbf9; }
			.check:has(input:checked) { background: var(--indigo-tint); }
			.check input {
				appearance: none; -webkit-appearance: none; margin: 0;
				width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--hair-2); background: var(--surface);
				display: grid; place-items: center; transition: background .2s, border-color .2s; cursor: pointer;
			}
			.check input::after {
				content: ""; width: 10px; height: 6px; margin-top: -3px;
				border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) scale(0); transition: transform .2s var(--ease);
			}
			.check input:checked { background: var(--indigo); border-color: var(--indigo); }
			.check input:checked::after { transform: rotate(-45deg) scale(1); }
			.check input:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
			.check time {
				font: 500 12px/22px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--indigo);
				font-variant-numeric: tabular-nums; white-space: nowrap;
			}
			.check .t { min-width: 0; }
			.check strong { display: block; font-weight: 500; font-size: 15px; line-height: 22px; letter-spacing: -0.01em; }
			.check span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
			.check:has(input:checked) strong { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--hair-2); }

			footer { display: flex; justify-content: space-between; gap: 16px; padding: 28px 0 56px; border-top: 1px solid var(--hair-2); font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

			@media (max-width: 520px) {
				.check { grid-template-columns: auto 1fr; gap: 4px 14px; }
				.check time { grid-column: 2; grid-row: 1; }
				.check .t { grid-column: 2; }
				footer { flex-direction: column; }
			}
			@media (prefers-reduced-motion: reduce) { .bar span, .check input::after { transition: none; } }
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<div class="invite">
					<p class="kicker">Wedding admin</p>
					<p class="when">Nov 2026 – Jun 2027</p>
					<h1><span>Anja</span> <span class="amp">&amp;</span> João</h1>
					<p class="intro">Everything to sort out before and after Copenhagen, one small step at a time.</p>
					<div class="progress"><div class="bar"><span id="fill"></span></div><span id="count">0 / 0</span></div>
				</div>
			</header>

			<section aria-labelledby="before">
				<h2 id="before">Before the trip</h2>
				<div class="checks">
					<label class="check"><input type="checkbox" id="s12" /><time>9 Nov</time><div class="t"><strong>Decide on a prenup</strong><span>Optional. Default is Zugewinngemeinschaft. To sign before the wedding, book a notary before 6 Dec. Can also be signed later.</span></div></label>
					<label class="check"><input type="checkbox" id="s2" /><time>23 Nov</time><div class="t"><strong>Buy the apostille online</strong><span>Danish Foreign Ministry webshop. Keep the receipt email.</span></div></label>
					<label class="check"><input type="checkbox" id="s3" /><time>6 Dec</time><div class="t"><strong>Pack documents</strong><span>Both IDs, apostille receipt on your phone, a folder for the certificates.</span></div></label>
				</div>
			</section>

			<section aria-labelledby="cph">
				<h2 id="cph">In Copenhagen</h2>
				<div class="checks">
					<label class="check"><input type="checkbox" id="s4" /><time>9 Dec</time><div class="t"><strong>Keep both certificates safe</strong><span>You get two on the day, already in German. Take a photo of one.</span></div></label>
					<label class="check"><input type="checkbox" id="s5" /><time>10 Dec</time><div class="t"><strong>Get the apostille in person</strong><span>Take one original and the receipt to the Ministry. Stamped while you wait.</span></div></label>
				</div>
			</section>

			<section aria-labelledby="away">
				<h2 id="away">While away</h2>
				<div class="checks">
					<label class="check"><input type="checkbox" id="s17" /><time>14 Dec</time><div class="t"><strong>Request the day off with MOIA</strong><span>Ask whether your own wedding counts as paid special leave.</span></div></label>
					<label class="check"><input type="checkbox" id="s6" /><time>14 Dec</time><div class="t"><strong>Book the Bürgeramt</strong><span>Online, for a date after 4 Jan. Updates marital status. Free. Bring a certificate and both IDs.</span></div></label>
					<label class="check"><input type="checkbox" id="s8" /><time>14 Dec</time><div class="t"><strong>Tell your employers</strong><span>Email HR with a photo of the certificate.</span></div></label>
					<label class="check"><input type="checkbox" id="s9" /><time>14 Dec</time><div class="t"><strong>Tell your health insurers</strong><span>Via their apps. Ask about family insurance if relevant.</span></div></label>
					<label class="check"><input type="checkbox" id="s10" /><time>14 Dec</time><div class="t"><strong>Merge insurance</strong><span>One liability and one household contents policy for both of you.</span></div></label>
					<label class="check"><input type="checkbox" id="s11" /><time>15 Dec</time><div class="t"><strong>Anja's life insurance and private pension</strong><span>Check who's named as beneficiary on each, and change it to her spouse if needed.</span></div></label>
				</div>
			</section>

			<section aria-labelledby="pt">
				<h2 id="pt">In Portugal</h2>
				<div class="checks">
					<label class="check"><input type="checkbox" id="s7" /><time>24 Dec</time><div class="t"><strong>Get João's birth certificate</strong><span>Conservatória do Registo Civil, plus the EU multilingual form. If closed, order it via Civil Online.</span></div></label>
				</div>
			</section>

			<section aria-labelledby="back">
				<h2 id="back">Back in Germany</h2>
				<div class="checks">
					<label class="check"><input type="checkbox" id="s13" /><time>8 Feb</time><div class="t"><strong>Check the tax class</strong><span>Payslip should show IV. Switch in ELSTER only if incomes differ a lot.</span></div></label>
					<label class="check"><input type="checkbox" id="s15" /><time>1 Jun</time><div class="t"><strong>Do the 2026 joint tax return</strong><span>Covers the whole year. Deadline 31 Jul 2027 if you file yourselves.</span></div></label>
				</div>
			</section>

			<footer><div>Anja &amp; João · København 2026</div><div>Ticks are saved in this browser</div></footer>
		</div>

		<script>
			const boxes = [...document.querySelectorAll('.check input')];
			const KEY = 'aj-wedding-checklist';
			let saved = {};
			try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
			const update = () => {
				const n = boxes.filter(b => b.checked).length;
				document.getElementById('count').textContent = n + ' / ' + boxes.length;
				document.getElementById('fill').style.width = (n / boxes.length * 100) + '%';
			};
			boxes.forEach(b => {
				b.checked = !!saved[b.id];
				b.addEventListener('change', () => {
					saved[b.id] = b.checked;
					try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
					update();
				});
			});
			update();
		</script>
	</body>
</html>
